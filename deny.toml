# cargo-deny: supply-chain policy for the GnB workspace.
# Run: cargo deny check   (advisories, bans, licenses, sources). Enforced in CI
# (.github/workflows/ci.yml, job `supply-chain`), together with cargo-audit.
#
# Policy: no known-vulnerable or yanked dependency without a written,
# reachability-based exception below; permissive licenses only, plus the
# first-party AGPL crates named explicitly; no git or unknown-registry
# sources (the forks are vendored under crates/ and Cargo.lock is committed).
#
# REVIEW BY 2027-01-15, and after every dependency bump: cargo-deny reports
# unmatched ignores, skips and license entries as warnings; delete them.

# Audit OPS-2: every check runs over the graph with ALL features enabled, so
# an optional dependency of a documented build (the node's `sev-snp` feature,
# deploy/gnb-node.service) is held to the same policy as the default build.
# The plain `cargo deny check` in CI therefore covers every feature.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Every ignore carries its reason. Unmaintained notices are accepted only
# where there is no drop-in replacement; vulnerabilities only where the
# vulnerable code is not compiled or not reachable and no compatible fixed
# release exists (see the hickory entries).
ignore = [
    # ── Post-quantum signatures: PQClean upstream archived ─────────────────
    # The pqcrypto-* wrappers are flagged unmaintained because PQClean is
    # archived. GnB pins them exactly (gnb-crypto: pqcrypto-mldsa =0.1.2,
    # pqcrypto-falcon =0.4.1) and vendors pqcrypto-internals (seeded-RNG
    # fork, crates/pqcrypto-internals, source pin in VENDOR.toml checked by
    # tests/vendor_pin.rs) so the ML-DSA-65 / Falcon-1024 code and its KATs
    # are frozen. No drop-in replacement keeps the same keys and KATs;
    # moving to a maintained backend is a planned crypto-review event, not a
    # `cargo update`.
    "RUSTSEC-2026-0165", # pqcrypto-falcon unmaintained (PQClean archived)
    "RUSTSEC-2026-0166", # pqcrypto-mldsa unmaintained (PQClean archived)
    "RUSTSEC-2026-0162", # pqcrypto-traits unmaintained (PQClean archived)
    # pqcrypto-mlkem (pinned =0.1.1): the node's post-quantum P2P handshake
    # (node/src/transport/upgrade.rs) is ML-KEM-768 hybrid with X25519 on the
    # mainnet line; it replaced pqcrypto-kyber, whose RUSTSEC-2024-0381
    # ignore was removed with it. Moving to the pure-Rust `ml-kem` crate keeps
    # the FIPS 203 wire format but swaps the implementation under every
    # peer's handshake: a reviewed change, not a `cargo update`.
    "RUSTSEC-2026-0161", # pqcrypto-mlkem unmaintained (PQClean archived)
    # ── Unmaintained, no runtime alternative needed ────────────────────────
    # bincode 2.0.1 is unmaintained (no advisory against its code). Used for
    # the node's local caches and the bounded gossip decoder
    # (network::decode_wire_message: byte limit + post-decode bounds,
    # fuzzed by node/fuzz). Replacing it is a wire/data-format migration.
    "RUSTSEC-2025-0141", # bincode unmaintained
    # paste: compile-time proc-macro helper (transitive), no runtime code.
    "RUSTSEC-2024-0436", # paste unmaintained
    # (Audit OPS-2: the hickory-proto 0.25.2 ignores RUSTSEC-2026-0118 and
    # RUSTSEC-2026-0119 were removed when the node moved to libp2p 0.57, which
    # brings hickory 0.26.3; node/tests/supply_chain_lockfile_guard.rs keeps
    # hickory at a fixed release.)
]

[bans]
# Audit finding SC3-yamux-dedupe (Bloch, round 2): "warn" let yamux 0.12.1
# (GHSA-vxx9-2994-q338) sit next to the fixed 0.13.10, and libp2p-yamux ran
# the 0.12 copy. Duplicates fail unless allowlisted below.
multiple-versions = "deny"
wildcards = "warn"          # avoid `*` version reqs
allow-wildcard-paths = true # path deps in the workspace are fine

# Audit CRY-6: `blst` and `secp256k1` were declared by the node but used by
# no source file, and their C/assembly was compiled into every build. They
# were removed; these bans keep them (and their -sys crates) from coming back
# silently, directly or through a new dependency. GnB signs with ML-DSA-65 +
# Falcon-1024 only. (node/tests/supply_chain_lockfile_guard.rs checks the
# same on Cargo.lock in `cargo test`.) The rust-bitcoin oracle of the audit
# harness (audit/consistency) is a separate workspace and is not affected.
deny = [
    { crate = "blst", reason = "audit CRY-6: unused BLS12-381 C/assembly, removed" },
    { crate = "secp256k1", reason = "audit CRY-6: unused, removed; GnB has no ECDSA" },
    { crate = "secp256k1-sys", reason = "audit CRY-6: C library of secp256k1, removed" },
]

# Known-benign duplicate allowlist. Every entry pins the EXACT older version
# present today, so a new duplicate (yamux deliberately is not listed, and
# must never be) fails the job, and a graph move that resolves a duplicate
# leaves an unmatched-skip warning telling us to prune the entry. All are
# semver-major splits that `cargo update` cannot unify:
#   * bindgen 0.69 (librocksdb-sys build) vs 0.72; rustc-hash 1 vs 2 with it.
#   * sha2 / digest / block-buffer 0.9: the node's `sha2_v9` alias.
#   * rand / rand_core / rand_chacha 0.8 vs 0.9, getrandom 0.2 / 0.3 / 0.4,
#     r-efi, wit-bindgen, windows-sys: rand-ecosystem and OS-shim splits
#     (the shims are target-gated and never co-linked).
#   * thiserror 1 vs 2, hashbrown, base64 0.22 vs 0.23, syn 2 vs 3:
#     ordinary ecosystem lag inside libp2p / reqwest, no crypto-facing
#     surface shared between the copies.
#   * x25519-dalek 2 (curve25519-dalek 4) is the node's own X25519 half of
#     the hybrid P2P handshake (node/src/transport/upgrade.rs, mainnet line);
#     libp2p-noise 0.47 brings 3.0 (curve25519-dalek 5). Each copy derives
#     its own keys; nothing passes values between them.
#   * libp2p 0.57 (audit OPS-2) moved its identity/noise stack to the
#     RustCrypto 0.11 generation: sha2 0.11, hmac 0.13, hkdf 0.13,
#     crypto-common 0.2, cpufeatures 0.3, chacha20 0.10, curve25519-dalek 5,
#     fiat-crypto 0.3. The 0.10-generation copies are the node's and
#     gnb-crypto's own (aes-gcm, hmac, hkdf, sha2 pins of the consensus and
#     wallet code) and snow 0.10's; nothing passes values between the copies.
skip = [
    { crate = "base64@=0.22.1" },
    { crate = "bindgen@=0.69.5" },
    { crate = "block-buffer@=0.9.0" },
    { crate = "block-buffer@=0.10.4" },
    { crate = "chacha20@=0.9.1" },
    { crate = "cpufeatures@=0.2.17" },
    { crate = "crypto-common@=0.1.7" },
    { crate = "curve25519-dalek@=4.1.3" },
    { crate = "digest@=0.9.0" },
    { crate = "digest@=0.10.7" },
    { crate = "fiat-crypto@=0.2.9" },
    { crate = "getrandom@=0.2.17" },
    { crate = "getrandom@=0.3.4" },
    { crate = "hashbrown@=0.14.5" },
    { crate = "hkdf@=0.12.4" },
    { crate = "hmac@=0.12.1" },
    { crate = "r-efi@=5.3.0" },
    { crate = "rand@=0.8.6" },
    { crate = "rand@=0.9.4" },
    { crate = "rand_chacha@=0.3.1" },
    { crate = "rand_core@=0.6.4" },
    { crate = "rand_core@=0.9.5" },
    { crate = "rustc-hash@=1.1.0" },
    { crate = "sha2@=0.9.9" },
    { crate = "sha2@=0.10.9" },
    { crate = "syn@=2.0.117" },
    { crate = "thiserror@=1.0.69" },
    { crate = "thiserror-impl@=1.0.69" },
    { crate = "windows-sys@=0.52.0" },
    { crate = "windows-sys@=0.59.0" },
    { crate = "wit-bindgen@=0.51.0" },
    { crate = "x25519-dalek@=2.0.1" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses only. AGPL/GPL/LGPL are NOT allowed globally: the
# first-party AGPL crates are named in the exceptions below, so any
# third-party copyleft dependency still fails (the one reviewed exception is
# option-ext's file-level MPL-2.0, scoped to that crate and release, below;
# with [graph] all-features the check covers every feature). Entries that cargo-deny reports
# as never encountered are removed (add one back only for a reviewed
# dependency that needs it).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]

# ── First-party AGPL crates ──────────────────────────────────────────────────
# cargo-deny applies the license policy to workspace members too. These are
# exactly the AGPL-3.0-or-later members of the root Cargo.toml; keep the two
# lists equal (a renamed member fails the check, a stale entry warns as
# "license exception was not encountered").
[[licenses.exceptions]]
name = "gnb"                # node/
allow = ["AGPL-3.0-or-later"]
[[licenses.exceptions]]
name = "gnb-crypto"         # crates/gnb-crypto
allow = ["AGPL-3.0-or-later"]
[[licenses.exceptions]]
name = "gnb-wallet-wasm"    # crates/gnb-wallet-wasm
allow = ["AGPL-3.0-or-later"]
[[licenses.exceptions]]
name = "coherence-core"     # crates/coherence-core
allow = ["AGPL-3.0-or-later"]
[[licenses.exceptions]]
name = "gnb-secret"         # crates/gnb-secret
allow = ["AGPL-3.0-or-later"]

# ── Third-party permissive-data license ─────────────────────────────────────
# webpki-roots (Mozilla CA set, via reqwest / libp2p-websocket) ships the CA
# data under CDLA-Permissive-2.0: permissive, no copyleft on linking code.
# Scoped to this crate so the global policy is not widened.
[[licenses.exceptions]]
name = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

# ── Third-party file-level copyleft (audit OPS-2) ────────────────────────────
# option-ext 0.2.0 (MPL-2.0) reaches the graph only through the optional
# `sev-snp` feature: sev 8 -> dirs 6 -> dirs-sys 0.5 -> option-ext. MPL-2.0
# is copyleft per FILE: modified copies of option-ext's own source files must
# stay MPL-2.0 and be offered as source; it places no condition on the code
# linking it (MPL-2.0 s3.3, "Larger Work"), and the crate carries no
# "Incompatible With Secondary Licenses" notice, so it combines with the AGPL
# node. GnB ships option-ext unmodified. Scoped to this crate and this exact
# version: any other MPL dependency, or another option-ext release, fails the
# check and needs its own review.
[[licenses.exceptions]]
crate = "option-ext@=0.2.0"
allow = ["MPL-2.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"   # no external git deps: the forks are vendored in crates/
