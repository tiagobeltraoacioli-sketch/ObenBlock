[package]
name = "gnb-smh"
version = "0.1.0"
edition = "2021"
description = "GnB-SMH v1 (Gödel and Bell Sequential Memory-Hard): post-quantum proof-of-work over SHAKE-256, and the ledger v1 prototype; standalone reference implementation from the ObenBlock repository (GnB-SMH is GnB's proof of work, replaced by SHA-256d in the ObenBlock relaunch, in progress)"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
keccak = "0.1"
sha3 = "0.10"

[dev-dependencies]
serde_json = "1"
hex = "0.4"

# Its own workspace (the root workspace excludes it). Explicit, so cargo never
# walks up into an enclosing checkout's workspace (e.g. a worktree nested
# inside another clone).
[workspace]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Audit POW-9: like the consensus workspace (root Cargo.toml), every profile
# fails closed identically on integer overflow (panic), never wraps in
# release and panics in debug. Guarded by tests/build_profile.rs.
overflow-checks = true
