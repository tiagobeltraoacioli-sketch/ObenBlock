[package]
name = "coherence-core"
version = "0.1.0"
edition = "2021"
description = "ObenBlock Coherence shielded-pool primitives, inherited from Bloch-SIS (notes, SHAKE-256 commitments/nullifiers/Merkle, spend statement). Lean + portable: shared by the node, the SP1 guest prover, and the mobile wallet — single source of truth."
license = "AGPL-3.0-or-later"

[dependencies]
sha3 = "0.10"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# Property tests of the spend statement and the incremental tree (COH-1, COH-2).
proptest = "1"
