<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ObenBlock Explorer</title>
<meta name="description" content="Block explorer for ObenBlock, the SHA-256d proof-of-work BlockDAG with PoWit finality: blocks, the GhostDAG, transactions, addresses and holders.">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:title" content="ObenBlock Explorer"><meta property="og:image" content="/og-image.png"><meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root {
  --void: #000000; --panel: #0b0907; --panel-2: #14100c; --line: #2b2420; --line-2: #3d332c;
  --ink: #ffffff; --text: #e6e0da; --mute: #a0958d; --fluor: #ff5f15; --fluor-hi: #ffb547; --fluor-ink: #170600;
  /* Chart marks (validated on #000: lightness band, chroma, CVD, contrast). */
  --mark: #f04a00; --dag-chain: #f04a00; --dag-blue: #3f8ff0; --dag-red: #c04fc0;
  --f-display: "Poppins", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --f-text: "Figtree", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --wrap: 1180px; --gutter: clamp(16px, 4vw, 40px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--void); }
body { margin: 0; background: var(--void); color: var(--text); font-family: var(--f-text); font-size: 1rem; line-height: 1.55; -webkit-font-smoothing: antialiased; }
a { color: var(--ink); text-decoration-color: var(--fluor); text-underline-offset: 3px; }
a:hover { color: var(--fluor-hi); }
:focus-visible { outline: 2px solid var(--fluor); outline-offset: 3px; border-radius: 2px; }
::selection { background: var(--fluor); color: var(--fluor-ink); }
h1, h2, h3 { font-family: var(--f-display); color: var(--ink); font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; margin: 0; }
p { margin: 0; }
.mono, code { font-family: var(--f-mono); font-feature-settings: "zero" 1; }
.wrap { width: 100%; max-width: calc(var(--wrap) + 2 * var(--gutter)); margin-inline: auto; padding-inline: var(--gutter); }

.top { position: sticky; top: 0; z-index: 10; background: rgba(0,0,0,.86); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 20px; min-height: 60px; }
.brandlink { display: flex; align-items: center; gap: 12px; flex: none; text-decoration: none; }
.brandlink .mono-tile { width: 30px; height: 30px; display: block; }
.brandlink .wm { font-family: var(--f-display); font-weight: 600; font-size: 1.4rem; line-height: 1; letter-spacing: -.06em; color: var(--ink); }
.brandlink .wm b { color: var(--fluor); font-weight: 600; }
.tag { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--fluor); border: 1px solid var(--line-2); border-radius: 4px; padding: 2px 6px; }
.nav { display: flex; gap: 20px; margin-left: auto; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.nav::-webkit-scrollbar { display: none; }
.nav a { font-family: var(--f-mono); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); text-decoration: none; white-space: nowrap; padding-block: 6px; }
.nav a:hover, .nav a[aria-current="page"] { color: var(--ink); }

.searchbar { border-bottom: 1px solid var(--line); background: var(--panel); }
.searchbar form { display: flex; gap: 10px; padding-block: 14px; }
.searchbar input { flex: 1; min-width: 0; background: var(--void); color: var(--ink); border: 1px solid var(--line-2); border-radius: 6px; padding: 11px 14px; font-family: var(--f-mono); font-size: .85rem; }
.searchbar input::placeholder { color: var(--mute); }
.searchbar input:focus { outline: none; border-color: var(--fluor); }
.btn { font-family: var(--f-display); font-weight: 600; font-size: .9rem; padding: 10px 18px; border-radius: 6px; border: 1px solid var(--fluor); background: var(--fluor); color: var(--fluor-ink); cursor: pointer; }
.btn:hover { background: var(--fluor-hi); border-color: var(--fluor-hi); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-2); }
.btn.ghost:hover { border-color: var(--ink); }
.btn[disabled] { opacity: .4; cursor: default; }

main { padding-block: 28px 80px; min-height: 70vh; }
.eyebrow { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--fluor); }
.pagehead { display: grid; gap: 10px; margin-bottom: 26px; }
.pagehead h1 { font-size: clamp(1.6rem, 3.4vw, 2.4rem); }
.pagehead .sub { color: var(--mute); }
.hash { font-family: var(--f-mono); font-size: .85rem; word-break: break-all; color: var(--text); }
.copy { margin-left: 8px; background: none; border: 1px solid var(--line-2); color: var(--mute); border-radius: 4px; font-family: var(--f-mono); font-size: .68rem; padding: 2px 6px; cursor: pointer; vertical-align: middle; }
.copy:hover { color: var(--ink); border-color: var(--ink); }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.stat { padding: 18px 20px; display: grid; gap: 6px; align-content: start; border-left: 1px solid var(--line); }
.stat:nth-child(4n+1) { border-left: 0; }
.stat:nth-child(n+5) { border-top: 1px solid var(--line); }
.stat .k { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.stat .v { font-family: var(--f-display); font-weight: 600; font-size: clamp(1.35rem, 2.4vw, 1.85rem); color: var(--ink); line-height: 1.05; font-variant-numeric: tabular-nums; }
.stat .v.hot { color: var(--fluor); }
.stat .d { font-family: var(--f-mono); font-size: .72rem; color: var(--mute); }
.meter { height: 6px; background: var(--panel-2); border-radius: 4px; overflow: hidden; display: flex; gap: 2px; margin-top: 4px; }
.meter i { display: block; height: 100%; }

.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; min-width: 0; }
.card h2 { font-size: 1.1rem; }
.cardhead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.cardhead .note { font-family: var(--f-mono); font-size: .72rem; color: var(--mute); }
section.block { margin-top: 22px; }

.live { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: .72rem; color: var(--mute); }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--fluor); box-shadow: 0 0 0 0 rgba(255,95,21,.6); animation: pulse 2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,95,21,.55); } 70% { box-shadow: 0 0 0 8px rgba(255,95,21,0); } 100% { box-shadow: 0 0 0 0 rgba(255,95,21,0); } }
@media (prefers-reduced-motion: reduce) { .live i { animation: none; } }

.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .88rem; }
th { text-align: left; font-family: var(--f-mono); font-weight: 500; font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); padding: 10px 12px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.fresh td { animation: fresh 1.6s ease-out; }
@keyframes fresh { from { background: rgba(255,95,21,.14); } to { background: transparent; } }
tbody tr:hover td { background: rgba(255,255,255,.025); }
td .mono, td code { font-size: .82rem; }

.kv { display: grid; grid-template-columns: minmax(140px, 220px) minmax(0, 1fr); }
.kv > div { padding: 11px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.kv > div:nth-child(odd) { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); padding-top: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: .78rem; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--line-2); text-decoration: none; color: var(--text); }
.chip:hover { border-color: var(--ink); color: var(--ink); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.dot.chain { background: var(--dag-chain); }
.dot.blue { background: var(--dag-blue); }
.dot.red { background: transparent; border: 2px dashed var(--dag-red); }
.dot.pending { background: transparent; border: 2px solid var(--mute); }
.badge { display: inline-flex; align-items: center; gap: 7px; font-family: var(--f-mono); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--text); }

.io { display: grid; grid-template-columns: minmax(0, 1fr) 28px minmax(0, 1fr); gap: 12px; align-items: start; }
.io .arrow { color: var(--fluor); font-family: var(--f-mono); text-align: center; padding-top: 10px; }
.io ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.io li { background: var(--void); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 4px; min-width: 0; }
.io li .amt { font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--ink); }
.io li .addr { font-family: var(--f-mono); font-size: .78rem; word-break: break-all; }
.io li .meta { font-family: var(--f-mono); font-size: .7rem; color: var(--mute); }

.amount { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.amount small { color: var(--mute); }
.pos { color: #7fd1a8; } .neg { color: var(--text); }
.bar { height: 8px; border-radius: 4px; background: var(--mark); min-width: 2px; }
.bartrack { background: var(--panel-2); border-radius: 4px; overflow: hidden; }
.pager { display: flex; gap: 10px; justify-content: flex-end; align-items: center; margin-top: 14px; font-family: var(--f-mono); font-size: .78rem; color: var(--mute); }

.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart .axis text { fill: var(--mute); font-family: var(--f-mono); font-size: 10px; }
.tip { position: absolute; pointer-events: none; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 6px; padding: 7px 10px; font-family: var(--f-mono); font-size: .72rem; color: var(--text); white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); opacity: 0; transition: opacity .12s; z-index: 2; }
.tip b { color: var(--ink); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; font-family: var(--f-mono); font-size: .72rem; color: var(--mute); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }

.dag { position: relative; overflow-x: auto; border-radius: 8px; background: var(--void); border: 1px solid var(--line); }
.dag svg { display: block; }
.dag .edge { stroke: var(--line-2); stroke-width: 1.25; fill: none; }
.dag .edge.sp { stroke: var(--dag-chain); stroke-opacity: .55; stroke-width: 2; }
.dag a:hover circle { stroke: var(--ink); stroke-width: 2; }

.empty, .err { padding: 26px; text-align: center; color: var(--mute); font-family: var(--f-mono); font-size: .85rem; }
.err { color: var(--fluor-hi); }
.skel { display: inline-block; height: 1em; width: 6ch; border-radius: 4px; background: linear-gradient(90deg, var(--panel-2), #1f1914, var(--panel-2)); background-size: 200% 100%; animation: sk 1.2s infinite linear; vertical-align: middle; }
@keyframes sk { to { background-position: -200% 0; } }
.callout { border: 1px solid var(--line-2); border-left: 3px solid var(--fluor); border-radius: 6px; padding: 12px 14px; background: var(--panel); font-size: .9rem; }

footer { border-top: 1px solid var(--line); padding-block: 28px; color: var(--mute); font-size: .85rem; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 10px 24px; justify-content: space-between; }

@media (max-width: 900px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat:nth-child(odd) { border-left: 0; } .stat:nth-child(even) { border-left: 1px solid var(--line); }
  .stat:nth-child(n+3) { border-top: 1px solid var(--line); }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .io { grid-template-columns: minmax(0, 1fr); } .io .arrow { transform: rotate(90deg); padding: 0; }
  .kv { grid-template-columns: minmax(0, 1fr); } .kv > div:nth-child(odd) { border-bottom: 0; padding-bottom: 0; }
  .hide-sm { display: none; }
}
@media (max-width: 560px) { .brandlink .wm { display: none; } .searchbar .btn { padding-inline: 12px; } }
</style>
</head>
<body>
<header class="top"><div class="wrap"><a class="brandlink" href="/" aria-label="ObenBlock home"><img class="mono-tile" src="/favicon.svg" alt="" width="30" height="30"><span class="wm">obenblock<b>.</b></span></a><span class="tag">Explorer</span>
<nav class="nav" aria-label="Explorer"><a href="#/" data-nav="home">Overview</a><a href="#/blocks" data-nav="blocks">Blocks</a><a href="#/dag" data-nav="dag">DAG</a><a href="#/holders" data-nav="holders">Holders</a><a href="/wallet">Wallet</a><a href="/">ObenBlock</a></nav>
</div></header>
<div class="searchbar"><div class="wrap"><form id="search" role="search" autocomplete="off">
<input id="q" name="q" type="search" spellcheck="false" placeholder="Search a block hash, transaction id, address or chain height" aria-label="Search">
<button class="btn" type="submit">Search</button></form></div></div>
<main><div class="wrap" id="app" aria-live="polite"></div></main>
<footer><div class="wrap"><p>ObenBlock Explorer · mainnet at launch · not audited</p><p>Data from a node through a read-only API. <a href="/">obenblock.xyz</a> · <a href="/downloads">Downloads</a> · <a href="/brand">Brand</a></p></div></footer>

</body>
